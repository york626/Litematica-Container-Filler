pluginManagement {
    // 本地离线构建：缓存里只有 fabric-loom 的**模块**、没有 **插件标记**（fabric-loom.gradle.plugin），
    // 直接按模块坐标解析即可（2026-11-03 加，只为在本机 --offline 构建）
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'fabric-loom') {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
    }
}
rootProject.name = 'litematica_container_filler'
